<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Quest — Suivi de tâches RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a1208'/%3E%3Crect x='3' y='2' width='10' height='2' fill='%23ff7000'/%3E%3Crect x='2' y='4' width='12' height='2' fill='%23ff7000'/%3E%3Crect x='2' y='6' width='12' height='6' fill='%23ffc46b'/%3E%3Crect x='4' y='12' width='8' height='2' fill='%23ff7000'/%3E%3C/svg%3E" />
<style>
:root {
  --bg: #000000;
  --panel: #161310;
  --card: #1e1a16;
  --accent: #ff7000;
  --accent-dark: #c25400;
  --text: #f5e6c8;
  --muted: #a08a68;
  --danger: #d43d2a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "VT323", "Courier New", monospace;
  font-size: 20px;
  line-height: 1.3;
}
.app { max-width: 1200px; margin: 0 auto; padding: 16px; }
h1, h2, h3, .brand-name, .tab, .btn, .column-header, .hud-badge, .task-diff,
.rarity-tag, .slot-tag, .xp-label, .hero-name, .ach-name {
  font-family: "Press Start 2P", "VT323", monospace;
}
.panel {
  background: var(--panel);
  border: 3px solid var(--accent-dark);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5);
  padding: 14px;
  border-radius: 8px;
}
.panel-title { margin: 0 0 10px; font-size: 12px; color: var(--accent); letter-spacing: 1px; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex-wrap: wrap; margin-bottom: 14px;
  border-bottom: 3px solid var(--accent-dark); padding-bottom: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-size: 16px; }
.brand-name em { font-style: normal; color: var(--accent); }
.hud { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hud-badge {
  font-size: 10px; background: var(--card);
  border: 2px solid var(--accent-dark); padding: 7px 10px; color: var(--accent);
  border-radius: 4px;
}
.tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.tab {
  font-size: 10px; padding: 10px 14px; background: var(--card);
  color: var(--muted); border: 2px solid transparent; cursor: pointer;
  border-radius: 4px;
}
.tab:hover { color: var(--text); border-color: var(--accent-dark); }
.tab-active { color: var(--accent); border-color: var(--accent); background: var(--panel); }
.btn {
  font-family: "Press Start 2P", monospace; font-size: 10px; padding: 10px 14px;
  background: var(--card); color: var(--text); border: 2px solid var(--accent-dark); cursor: pointer;
  border-radius: 4px;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-accent { background: var(--accent); color: #1a1208; }
.btn-accent:hover:not(:disabled) { background: var(--accent-dark); color: #fff3e0; }
.btn-danger { border-color: var(--danger); color: var(--danger); }
input, textarea, select {
  font-family: "VT323", monospace; font-size: 19px; background: var(--card);
  border: 2px solid var(--accent-dark); color: var(--text); padding: 8px 10px; width: 100%;
  border-radius: 4px;
}
input:focus, textarea:focus { outline: 2px solid var(--accent); }
.board-actions { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
.filter-bar { margin-bottom: 14px; padding: 8px 10px; border: 1px dashed rgba(255,255,255,0.12); border-radius: 10px; gap: 6px; }
.filter-bar { position: relative; }
.filter-bar .chip { font-size: 11px; }
.filter-bar .chip-active { border-color: var(--accent); color: var(--accent); }
.filter-pop {
  position: absolute; top: 100%; left: 0; margin-top: 6px; z-index: 40;
  display: flex; flex-direction: column; gap: 2px; min-width: 210px;
  background: var(--panel); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
  padding: 6px; box-shadow: 0 10px 28px rgba(0,0,0,0.55);
}
.filter-opt {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: none; border: none; color: var(--text); font-family: inherit;
  cursor: pointer; text-align: left; font-size: 12px; padding: 7px 9px; border-radius: 7px;
}
.filter-opt:hover { background: rgba(255,255,255,0.07); }
.filter-opt.opt-active { background: rgba(255,112,0,0.14); color: var(--accent); }
.task-card .btn-action { font-size: 9px; padding: 7px 12px; }
.task-card .task-top .act-back { font-size: 17px; padding: 0 4px; color: var(--accent); margin-left: auto; }
.task-card .task-top .act-back:hover { color: #fff; background: var(--accent); border-radius: 4px; }
.task-card .task-top .task-delete { margin-left: 0; }
.board-actions .btn-big { font-size: 11px; padding: 12px 16px; }
.board-actions .spacer { flex: 1; }
.form-row { margin-bottom: 12px; }
.form-label { display: block; font-size: 17px; color: var(--muted); margin-bottom: 4px; }
.diff-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.diff-btn {
  font-family: "Press Start 2P", monospace; font-size: 9px; padding: 8px 10px;
  background: var(--card); border: 2px solid var(--muted); color: var(--muted);
  cursor: pointer; display: flex; flex-direction: column; gap: 5px; align-items: center;
  border-radius: 4px;
}
.diff-btn small { font-family: "VT323", monospace; font-size: 14px; }
.diff-btn.diff-active { color: var(--text); }
.diff-b-facile.diff-active { border-color: #6fdc8c; }
.diff-b-moyenne.diff-active { border-color: #ffc46b; }
.diff-b-difficile.diff-active { border-color: #ff7000; }
.diff-b-boss.diff-active { border-color: #ff4d4d; }
.label-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: "VT323", monospace; font-size: 15px; padding: 1px 9px;
  border-radius: 999px; color: #161005; white-space: nowrap;
}
.label-picker { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  font-family: "VT323", monospace; font-size: 17px; padding: 3px 12px;
  border: 2px solid var(--muted); border-radius: 999px;
  background: transparent; color: var(--text); cursor: pointer;
}
.chip.chip-active { border-color: var(--accent); color: var(--accent); }
.chip-create { display: flex; gap: 6px; margin-top: 8px; }
.chip-create input { flex: 1; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.board-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 14px; align-items: start; }
.board-main { min-width: 0; }
.board-side .panel-title { margin-bottom: 8px; }
.board-side .panel { padding: 12px 14px; }
.hero-side-card { text-align: center; }
.hero-side-card .hero-stage { transform-origin: bottom center; }
.hero-side-card .hero-name { font-size: 13px; margin-top: 8px; }
.hero-side-card .hero-title { font-size: 11px; }
.hero-side .xp-bar { margin-top: 8px; }
.hero-side .xp-label { font-size: 10px; }
.hero-side .hero-stats { font-size: 11px; }
.hero-side .hud-badge { display: block; text-align: left; }
.hero-side .panel-title { font-size: 11px; margin: 10px 0 4px; }
.hero-side .lootbox-row { margin-top: 6px; }
.hero-side .lootbox-hint { font-size: 10px; }
@media (max-width: 900px) { .board { grid-template-columns: 1fr; } .board-wrap { grid-template-columns: 1fr; } }
.column {
  background: var(--card); border: 3px solid var(--accent-dark);
  padding: 10px; min-height: 200px;
  border-radius: 8px;
}
.column-drop { border-color: var(--accent); border-style: dashed; }
.column-header {
  font-size: 11px; color: var(--accent); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.column-count { margin-left: auto; background: var(--panel); padding: 3px 8px; font-size: 10px; color: var(--muted); border-radius: 4px; }
.column-empty { color: var(--muted); text-align: center; padding: 20px 0; opacity: 0.6; }
.task-card {
  background: var(--panel); border-left: 5px solid var(--muted);
  padding: 10px; margin-bottom: 10px; cursor: grab;
  border-radius: 6px;
}
.task-card:active { cursor: grabbing; }
.task-card { box-shadow: 0 0 0 2px rgba(160, 138, 104, 0.18); }
.diff-facile { border-left-color: #6fdc8c; box-shadow: 0 0 0 2px rgba(111, 216, 140, 0.25); }
.diff-moyenne { border-left-color: #ffc46b; box-shadow: 0 0 0 2px rgba(255, 196, 107, 0.25); }
.diff-difficile { border-left-color: #ff7000; box-shadow: 0 0 0 2px rgba(255, 112, 0, 0.25); }
.diff-boss { border-left-color: #ff4d4d; box-shadow: 0 0 0 2px rgba(255, 77, 77, 0.25); }
.task-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.task-diff { font-size: 8px; color: var(--muted); }
.task-reward { margin-left: auto; font-size: 15px; color: var(--accent); }
.task-btn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 15px; padding: 0 2px; font-family: inherit;
}
.task-btn:hover { color: var(--accent); }
.task-btn.task-delete:hover { color: var(--danger); }
.task-title { font-size: 21px; cursor: pointer; }
.task-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.due-date { font-size: 15px; color: var(--muted); }
.due-date.overdue { color: #ff6b5e; font-weight: bold; }
.task-progress { font-size: 15px; color: var(--muted); }
.task-actions { margin-top: 10px; }
.btn-action { font-size: 12px; padding: 12px 16px; }
.btn-action.act-doing { border-color: #7aa2ff; color: #7aa2ff; }
.btn-action.act-doing:hover { background: #7aa2ff; color: #ffffff; }
.btn-action.act-done { border-color: #6fdc8c; color: #6fdc8c; }
.btn-action.act-done:hover { background: #6fdc8c; color: #ffffff; }
.task-overdue, .task-overdue.task-card {
  border-left-color: #e0453a;
  box-shadow: 0 0 0 2px #e0453a;
}
.task-overdue .due-date { color: #ff6b5e; font-weight: bold; }
.chip-x {
  border: none; background: rgba(0, 0, 0, 0.22); color: #161005; cursor: pointer;
  font-family: inherit; font-size: 13px; line-height: 1; padding: 1px 5px; border-radius: 999px;
}
.chip-x:hover { background: #161005; color: #fff; }
.btn-action.act-cancel, .btn-action.act-back { border-color: #c0c8d8; color: #c0c8d8; }
.btn-action.act-cancel:hover, .btn-action.act-back:hover { background: #2a3140; color: #ffffff; }
.subtask span[data-step-index] { cursor: text; }
.quest-progress { margin: 8px 0 4px; }
.quest-progress-label { font-size: 14px; color: var(--muted); margin-bottom: 3px; }
.quest-bar { height: 12px; background: #171a20; border: 2px solid #3c4657; border-radius: 9px; overflow: hidden; }
.quest-fill { height: 100%; background: #6fdc8c; transition: width 0.25s; border-radius: 6px; }
.boss-hp { margin: 8px 0 4px; }
.boss-hp-label { font-size: 14px; color: #ff4d4d; }
.hp-bar { height: 12px; background: #3a0a0a; border: 2px solid #ff4d4d; border-radius: 9px; overflow: hidden; }
.hp-fill { height: 100%; background: #ff4d4d; transition: width 0.25s; border-radius: 6px; }
.subtasks { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.subtask { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 17px; }
.subtask input { width: auto; }
.subtask .step-del { font-size: 14px; }
.subtask-done span { text-decoration: line-through; color: var(--muted); }
.subtask-add { margin-top: 6px; }
.subtask-add input { font-size: 15px; padding: 4px 8px; opacity: 0.8; }
/* ---------- modal ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 40; padding: 16px;
}
.modal-overlay.hidden { display: none; }
.modal { width: 620px; max-width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
.modal-close {
  position: absolute; top: 10px; right: 10px; background: none; border: none;
  color: var(--muted); font-size: 20px; cursor: pointer;
}
.modal-close:hover { color: var(--danger); }
#modal.modal-wide { width: 980px; width: min(980px, 94vw); }
.task-split { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; margin-top: 12px; align-items: start; }
@media (max-width: 820px) { #modal.modal-wide { width: 94vw; } .task-split { grid-template-columns: 1fr; } }
.pane { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; }
.pane h3 { margin: 2px 0 8px; font-size: 14px; color: var(--accent); }
.pane-right { text-align: left; }
.pane-right .form-row { margin-bottom: 10px; }
.note-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; max-height: 220px; overflow-y: auto; }
.note-entry { font-size: 13px; line-height: 1.45; padding: 6px 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; position: relative; padding-right: 26px; word-break: break-word; }
.note-date { color: var(--muted); font-size: 11px; display: block; }
.note-entry .step-del { position: absolute; right: 6px; top: 6px; }
.link-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-size: 13px; border-bottom: 1px dashed rgba(255,255,255,0.08); }
.link-row:last-of-type { border-bottom: none; }
.task-link { color: var(--accent); text-decoration: none; }
.task-link:hover { text-decoration: underline; }
.link-host { color: var(--muted); font-size: 11px; }
.attach-btn { display: inline-block; margin-top: 6px; cursor: pointer; position: relative; overflow: hidden; }
.attach-btn input[type=file] { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
.mini-inputs { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.chip-create input { min-width: 0; }
.checklist { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.hero-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 800px) { .hero-panel { grid-template-columns: 1fr; } }
.hero-card { text-align: center; }
.hero-stage { position: relative; display: inline-block; width: 96px; height: 152px; margin-top: 4px; }
.hero-layer { position: absolute; left: 50%; transform: translateX(-50%); }
.hero-bob { animation: bob 1.6s steps(2) infinite; }
@keyframes bob { 0%, 100% { margin-top: 0; } 50% { margin-top: -3px; } }
.hero-pet { left: auto; right: -36px; top: auto; bottom: 0; transform: none; }
.hero-name { font-size: 12px; margin-top: 12px; }
.hero-title { color: var(--accent); font-size: 10px; }
.xp-bar {
  height: 18px; border: 3px solid var(--accent-dark); background: var(--card);
  margin: 10px auto; max-width: 320px;
  border-radius: 4px; overflow: hidden;
}
.xp-fill {
  height: 100%;
  background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 8px, var(--accent-dark) 8px, var(--accent-dark) 16px);
  transition: width 0.4s steps(8);
}
.xp-label { font-size: 9px; color: var(--muted); margin-bottom: 14px; }
.hero-stats { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; font-size: 18px; }
.lootbox-row { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.lootbox-hint { font-size: 15px; color: var(--muted); }
.stats-card { text-align: center; }
.chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; justify-content: center; margin: 10px 0; }
.chart-col { display: flex; flex-direction: column; align-items: center; height: 100%; }
.chart-bar-area {
  flex: 1; width: 26px; display: flex; align-items: flex-end;
  background: var(--card); border: 2px solid var(--accent-dark);
  border-radius: 4px; overflow: hidden;
}
.chart-bar { width: 100%; background: var(--accent); min-height: 2px; transition: height 0.3s; }
.chart-label { font-size: 16px; color: var(--muted); margin-top: 4px; }
.stats-summary { font-size: 18px; color: var(--muted); }
.shop-banner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.shop-banner p { margin: 0; }
.gold-text { color: var(--accent); }
.shop-banner .btn { margin-left: auto; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.shop-card { display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
.shop-preview { min-height: 60px; display: flex; align-items: center; justify-content: center; }
.theme-swatches { display: flex; gap: 4px; }
.theme-swatch { width: 18px; height: 18px; border: 2px solid rgba(0, 0, 0, 0.4); }
.shop-item-name { font-size: 17px; }
.shop-item-meta { display: flex; gap: 6px; }
.rarity-tag, .slot-tag { font-size: 13px; padding: 1px 6px; border: 1px solid var(--muted); color: var(--muted); border-radius: 4px; }
.rarity-commun { border-color: #6fdc8c; }
.rarity-commun .rarity-tag { border-color: #6fdc8c; color: #6fdc8c; }
.rarity-rare { border-color: #7aa2ff; }
.rarity-rare .rarity-tag { border-color: #7aa2ff; color: #7aa2ff; }
.rarity-epique { border-color: #c46bff; }
.rarity-epique .rarity-tag { border-color: #c46bff; color: #c46bff; }
.rarity-legendaire { border-color: #ffc46b; box-shadow: 0 0 12px rgba(255, 196, 107, 0.35); }
.rarity-legendaire .rarity-tag { border-color: #ffc46b; color: #ffc46b; }
.shop-item-desc { font-size: 16px; color: var(--muted); flex: 1; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.ach-card { display: flex; gap: 12px; align-items: center; }
.ach-icon { font-size: 26px; }
.ach-name { font-size: 10px; margin-bottom: 6px; }
.ach-desc { font-size: 16px; color: var(--muted); }
.ach-locked { opacity: 0.5; }
.ach-unlocked { border-color: var(--accent); }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #1a1208; font-family: "Press Start 2P", monospace;
  font-size: 10px; padding: 14px 18px; border: 3px solid var(--accent-dark);
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5); z-index: 50; max-width: 90vw;
  border-radius: 4px;
}
.toast.hidden { display: none; }
.footer { margin-top: 24px; text-align: center; font-size: 15px; color: var(--muted); opacity: 0.7; }
.pixel-sprite { display: grid; line-height: 0; }
.pixel-sprite i { display: block; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span id="logo"></span>
      <span class="brand-name">TASK <em>QUEST</em></span>
    </div>
    <div class="hud">
      <span class="hud-badge" id="hud-level"></span>
      <span class="hud-badge" id="hud-gold"></span>
      <span class="hud-badge" id="hud-streak"></span>
      <button class="btn btn-danger" data-action="reset" title="Effacer la sauvegarde">⟲</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <footer class="footer">
    Task Quest — tes données restent dans ce navigateur (localStorage) · pense à 💾 Sauvegarde de temps en temps !
  </footer>
</div>
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal panel" id="modal"></div>
</div>
<div class="toast hidden" id="toast"></div>
<script>
(function () {
  "use strict";
  var SAVE_KEY = "mistral-quest-save-v1";
  var SUBTASK_REWARD = { xp: 18, gold: 2 };
  var DIFFS = {
    facile:    { label: "Facile",    xp: 10,  gold: 2,  icon: "🌱", badge: "diff-b-facile",  edge: "diff-facile" },
    moyenne:   { label: "Moyenne",   xp: 25,  gold: 5,  icon: "⚔️", badge: "diff-b-moyenne", edge: "diff-moyenne" },
    difficile: { label: "Difficile", xp: 50,  gold: 8,  icon: "🔥", badge: "diff-b-difficile", edge: "diff-difficile" },
    boss:      { label: "Boss",      xp: 120, gold: 12, icon: "💀", badge: "diff-b-boss", edge: "diff-boss", boss: true }
  };
  var COLUMNS = { todo: "À faire 📌", doing: "En cours 🏃", done: "Terminé 🏁" };
  var LABEL_COLORS = ["#ff7000", "#ffd54a", "#7aa2ff", "#6fdc8c", "#ff6b9d", "#b58cff", "#4fd6d2", "#c0c8d8"];
  var TABS = [
    ["board", "🗺️ Quêtes"],
    ["achievements", "🏆 Exploits"],

  var fileStore = (function () {
    var db = null;
    var mem = {};
    function ready(cb) {
      if (db || !window.indexedDB) return cb();
      try {

        rq.onupgradeneeded = function (ev) { ev.target.result.createObjectStore("files"); };

        rq.onerror = function () { cb(); };
      } catch (err) { cb(); }
    }

      put: function (key, blob, cb) {
        ready(function () {
          if (!db) { mem[key] = blob; return cb(true); }
          try {
            var tx = db.transaction("files", "readwrite");
            tx.objectStore("files").put(blob, key);
            tx.oncomplete = function () { cb(true); };
            tx.onerror = function () { cb(false); };
          } catch (err) { cb(false); }
        });
      },
      get: function (key, cb) {
        ready(function () {
          if (!db) return cb(mem[key] || null);
          try {
            var rq = db.transaction("files", "readonly").objectStore("files").get(key);
            rq.onsuccess = function () { cb(rq.result || null); };
            rq.onerror = function () { cb(null); };
          } catch (err) { cb(null); }
        });
      },
      del: function (key, cb) {
        ready(function () {
          if (!db) { delete mem[key]; return cb(); }
          try {

            tx.objectStore("files").delete(key);

      }
      if (act === "equip-item") {
        var it2 = shopById(el.getAttribute("data-item"));
        if (it2 && it2.type === "gear" && state.inventory.indexOf(it2.id) !== -1) {
          if (el.hasAttribute("data-unequip")) {
            if (state.equipment[it2.slot] === it2.id) delete state.equipment[it2.slot];
          } else {
            state.equipment[it2.slot] = it2.id;
            showToast("⚔️ " + it2.name + " équipé !");
          }
          saveState();
          renderAll();
        }
        return;
      }
      if (act === "reset") {
        if (confirm("Recommencer une nouvelle vie de héros ? Tout sera perdu (quêtes, niveau, butin).")) {
          try { localStorage.removeItem(SAVE_KEY); } catch (err) {}
          state = migrate(null);
          drafts = { title: "", due: "", steps: "", diff: "facile", labels: [] };
          closeModal();
          applyTheme();
          renderAll();
          showToast("🌟 Nouvelle partie !");
        }
        return;
      }
      if (act === "save-export") {
        var payload = JSON.stringify({ app: "mistral-quest", version: 1, exportedAt: new Date().toISOString(), save: state }, null, 2);
        var blob = new Blob([payload], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "mistral-quest-sauvegarde-" + todayKey() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        showToast("💾 Sauvegarde téléchargée — garde-la précieusement !");
        return;
      }
      if (act === "save-import") {
        if (existingImportInput) { existingImportInput.click(); return; }
        var input = document.createElement("input");
        input.type = "file";
        input.accept = "application/json,.json";
        input.style.display = "none";
        input.addEventListener("change", function () {
          var file = input.files && input.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            try {
              var data = JSON.parse(reader.result);
              var save = data && data.save ? data.save : data;
              if (!save || !Array.isArray(save.tasks)) throw new Error("format inconnu");
              state = migrate(save);
              saveState();
              applyTheme();
              renderAll();
              showToast("♻️ Sauvegarde restaurée : niveau " + state.level + " · " + state.tasks.length + " quêtes");
            } catch (err) {
              showToast("❌ Fichier invalide : pas une sauvegarde Task Quest");
            }
          };
          reader.readAsText(file);
        });
        document.body.appendChild(input);
        existingImportInput = input;
        input.click();
        return;
      }
      if (act === "set-theme") {
        state.theme = el.getAttribute("data-theme");
        applyTheme();
        saveState();
        renderAll();
        return;
      }
      if (act === "remove-subtask") {
        removeSubtask(el.getAttribute("data-task"), parseInt(el.getAttribute("data-index"), 10));
        openTaskModal(el.getAttribute("data-task"));
        refreshTaskModal && refreshTaskModal();
        renderAll();
        return;
      }
      if (act === "toggle-filter-menu") {
        openFilterMenu = openFilterMenu === el.getAttribute("data-menu") ? null : el.getAttribute("data-menu");
        renderAll();
        return;
      }
      if (act === "toggle-filter-label") {
        var fl = state.filters || (state.filters = { labels: [], dates: [] });
        var lid = el.getAttribute("data-label");
        fl.labels = fl.labels.indexOf(lid) !== -1 ? fl.labels.filter(function (x) { return x !== lid; }) : fl.labels.concat([lid]);
        saveState();
        renderAll();
        return;
      }
      if (act === "toggle-filter-date") {
        var fd = state.filters || (state.filters = { labels: [], dates: [] });
        var dk = el.getAttribute("data-date");
        fd.dates = fd.dates.indexOf(dk) !== -1 ? fd.dates.filter(function (x) { return x !== dk; }) : fd.dates.concat([dk]);
        saveState();
        renderAll();
        return;
      }
      if (act === "clear-filters") {
        state.filters = { labels: [], dates: [] };
        saveState();
        renderAll();
        showToast("✨ Filtres retirés");
        return;
      }
      if (act === "remove-note") { removeTaskNote(el.getAttribute("data-task"), el.getAttribute("data-note")); return; }
      if (act === "remove-link") { removeTaskLink(el.getAttribute("data-task"), el.getAttribute("data-link")); return; }
      if (act === "remove-attachment") { removeAttachment(el.getAttribute("data-task"), el.getAttribute("data-att")); return; }
      if (act === "download-attachment") { downloadAttachment(el.getAttribute("data-task"), el.getAttribute("data-att")); return; }
      if (act === "toggle-subtask") {
        var changed = toggleSubtask(el.getAttribute("data-task"), parseInt(el.getAttribute("data-index"), 10));
        if (changed) { renderAll(); refreshTaskModal(); }
        return;
      }
    }
    if (e.target.id === "modal-overlay") { closeModal(); syncAddDrafts(); }
  });
  document.addEventListener("dblclick", function (e) {
    var stepSpan = e.target.closest("#modal .subtask span[data-step-index]");
    if (stepSpan) {
      var lab = stepSpan.closest(".subtask").querySelector("input[data-task]");
      editStepIdx = parseInt(stepSpan.getAttribute("data-step-index"), 10);
      openTaskModal(lab ? lab.getAttribute("data-task") : openTaskId, true);
      return;
    }
    if (e.target.closest(".hero-stage")) {
      openHeroModal();
      return;
    }
    var card = e.target.closest(".task-card");
    if (!card) return;
    if (e.target.closest("button, input, .btn-action, .task-delete")) return;
    openTaskModal(card.getAttribute("data-task"));
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (openTaskId) syncAddDrafts();
      closeModal();
    }
  });
  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (f.id === "quest-form") {
      e.preventDefault();
      var titleEl = document.getElementById("add-title");
      var dueEl = document.getElementById("add-due");
      var tx = document.querySelector("#modal textarea[name=steps-text]");
      var title = (titleEl && titleEl.value || "").trim();
      if (!title) return;
      var subtasks = (tx && tx.value || "").split("\n").map(function (s) { return s.trim(); })
        .filter(Boolean).map(function (s) { return { text: s, done: false }; });
      var t = {
        id: uid(), title: title, diff: stepsToTierAndXP(subtasks.length).key, status: "todo",
        subtasks: subtasks, createdAt: todayKey(),
        dueDate: (dueEl && dueEl.value) || null,
        labels: drafts.labels.slice(), doneAt: null
      };
      state.tasks.push(t);
      drafts = { title: "", due: "", steps: "", diff: drafts.diff, labels: [] };
      closeModal();
      saveState();
      renderAll();
      showToast("📜 Quête ajoutée : " + title);
      return;
    }
    if (f.id === "hero-form") {
      e.preventDefault();
      var hname = (document.getElementById("hero-name").value || "").trim() || "Héros sans nom";
      var isNew = !state.hero;
      state.hero = { name: hname, cls: heroDraft.cls, skin: heroDraft.skin, gender: heroDraft.gender || "homme" };
      closeModal();
      saveState();
      heroDraft = { name: hname, cls: heroDraft.cls, skin: heroDraft.skin, gender: heroDraft.gender || "homme" };
      renderAll();
      showToast(isNew ? "⚔️ Bienvenue, " + hname + " ! Que l'aventure commence." : "💾 Héros mis à jour");
      return;
    }
    if (f.getAttribute && f.getAttribute("data-form") === "victory") {
      e.preventDefault();
      var tv = taskById(f.getAttribute("data-task"));
      if (tv) {
        var com = f.querySelector("input[name=quest-comment]");
        tv.comment = (com && com.value.trim()) || null;
        if (completeTask(tv)) {
          closeModal();
        } else {
          renderAll();
          return;
        }
      }
      renderAll();
      return;
    }
    if (f.getAttribute && f.getAttribute("data-form") === "edit-subtask") {
      e.preventDefault();
      var te = taskById(f.getAttribute("data-task"));
      var eidx = parseInt(f.getAttribute("data-index"), 10);
      var ev = f.querySelector("input[name=edit-step]").value.trim();
      if (te && te.subtasks[eidx]) {
        if (ev) te.subtasks[eidx].text = ev;
        editStepIdx = null;
        saveState();
        openTaskModal(te.id);
        renderAll();
      }
      return;
    }
    if (f.getAttribute && f.getAttribute("data-form") === "add-subtask") {
      e.preventDefault();
      var input = f.querySelector("input[name=subtask-text]");
      var txt = (input.value || "").trim();
      if (txt) {
        var task = taskById(f.getAttribute("data-task"));
        if (task) {
          task.subtasks.push({ text: txt, done: false });
          recomputeLevel(task.id);
          saveState();
          openTaskModal(task.id);
          renderAll();
        }
      }
      return;
    }
    if (f.getAttribute && f.getAttribute("data-form") === "add-task-note") {
      e.preventDefault();
      var noteInput = f.querySelector("input[name=note-text]");
      var noteTxt = (noteInput.value || "").trim();
      if (noteTxt) {
        noteInput.value = "";
        addTaskNote(f.getAttribute("data-task"), noteTxt);
      }
      return;
    }
    if (f.getAttribute && f.getAttribute("data-form") === "add-task-link") {
      e.preventDefault();
      var linkLabel = f.querySelector("input[name=link-label]");
      var linkUrl = f.querySelector("input[name=link-url]");
      var lbl = (linkLabel.value || "").trim();
      var url = (linkUrl.value || "").trim();
      if (lbl && url) addTaskLink(f.getAttribute("data-task"), lbl, url);
      return;
    }
    if (f.getAttribute && f.getAttribute("data-form") === "create-label") {
      e.preventDefault();
      var name = f.querySelector("input[name=label-name]").value;
      if (createLabel(name)) {
        openLabelsModal();
        renderAll();
        showToast("🏷️ Libellé créé !");
      }
      return;
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "add-title") drafts.title = e.target.value;
    if (e.target.id === "add-due") drafts.due = e.target.value;
    if (e.target.name === "steps-text") {
      drafts.steps = e.target.value;
      var at = document.getElementById("auto-tier");
      if (at) at.innerHTML = autoTierBadgeHTML();
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.getAttribute && e.target.getAttribute("data-action") === "upload-attachment") {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (file) addAttachment(e.target.getAttribute("data-task"), file);
      return;
    }
    if (e.target.getAttribute && e.target.getAttribute("data-action") === "rename-task") {
      var tr = taskById(e.target.getAttribute("data-task"));
      var nv = (e.target.value || "").trim();
      if (tr && nv && nv !== tr.title) {
        tr.title = nv;
        saveState();
        var hb = document.querySelector("#modal .task-top b");
        if (hb) hb.textContent = nv;
        renderAll();
        showToast("📜 Quête renommée");
      }
      return;
    }
    if (e.target.hasAttribute && e.target.hasAttribute("data-edit-due")) {
      var td = taskById(e.target.getAttribute("data-task"));
      if (td) {
        td.dueDate = e.target.value || null;
        saveState();
        showToast("📅 Échéance mise à jour");
        renderAll();
        openTaskModal(td.id);
      }
      return;
    }
    if (e.target.getAttribute && e.target.getAttribute("data-action") === "toggle-subtask") {
      var changed = toggleSubtask(e.target.getAttribute("data-task"), parseInt(e.target.getAttribute("data-index"), 10));
      if (changed) { renderAll(); refreshTaskModal(); }
    }
  });
  document.addEventListener("dragstart", function (e) {
    var card = e.target.closest(".task-card");
    if (card) { draggedId = card.getAttribute("data-task"); }
  });
  document.addEventListener("dragover", function (e) {
    var col = e.target.closest(".column");
    if (col) { e.preventDefault(); col.classList.add("column-drop"); }
  });
  document.addEventListener("dragleave", function (e) {
    var col = e.target.closest(".column");
    if (col) col.classList.remove("column-drop");
  });
  document.addEventListener("drop", function (e) {
    var col = e.target.closest(".column");
    if (col && draggedId) {
      e.preventDefault();
      col.classList.remove("column-drop");
      moveTask(draggedId, col.getAttribute("data-drop"));
      draggedId = null;
    }
  });
  var LOGO = [
    "................",
    "...OO......OO...",
    "..OOOO....OOOO..",
    "..OOOOO..OOOOO..",
    "...OOOOOOOOOO...",
    "....OOOOOOOO....",
    ".....OOOOOO.....",
    "......OOOO......",
    ".......OO.......",
    "................",
    "...BBBBBBBBBB...",
    "..BBBYYYYYYYYBB.",
    "..BBBYYYYYYYYBB.",
    "...BBBBBBBBBB...",
    "................",
    "................"
  ];
  document.getElementById("logo").innerHTML = spriteHTML(LOGO, "3px");
  applyTheme();
  renderAll();
  if (!state.hero) openHeroModal();
})();
</script>
</body>
</html>
